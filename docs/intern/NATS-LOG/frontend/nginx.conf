server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # go-api'ye reverse proxy: tarayıcı sadece kendi origin'ine (nginx)
    # istek atar, bu sayede start/stop butonları için CORS ayarı gerekmez.
    location /api/ {
        proxy_pass http://go-api:8080/;
    }
}